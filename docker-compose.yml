services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simrs-ta-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "2408:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: simrs-ta-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d laravel"]
      interval: 10s
      timeout: 5s
      retries: 10

  node:
    image: node:20-alpine
    container_name: simrs-ta-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    tty: true
    ports:
      - "5173:5173"

volumes:
  db_data:
  vendor:
